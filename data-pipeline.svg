<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" font-family="'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="0.5" stop-color="#764ba2"/>
      <stop offset="1" stop-color="#f093fb"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a2b"/>
      <stop offset="1" stop-color="#11111c"/>
    </linearGradient>
  </defs>
  <style>
    .fade { opacity: 0; animation: fade 0.7s ease forwards; }
    .n1 { animation-delay: 0.2s; } .n2 { animation-delay: 0.5s; }
    .n3 { animation-delay: 0.8s; } .n4 { animation-delay: 1.1s; } .n5 { animation-delay: 1.4s; }
    .flow { stroke-dasharray: 6 6; animation: dash 1s linear infinite; }
    .node { animation: glow 5s ease-in-out infinite; }
    .p1 { animation-delay: 0s; } .p2 { animation-delay: 1s; } .p3 { animation-delay: 2s; }
    .p4 { animation-delay: 3s; } .p5 { animation-delay: 4s; }
    @keyframes fade { to { opacity: 1; } }
    @keyframes dash { to { stroke-dashoffset: -12; } }
    @keyframes glow { 0%,100% { stroke: #2a2a44; stroke-width: 1.5; } 10%,20% { stroke: #f093fb; stroke-width: 2.5; } 35% { stroke: #2a2a44; stroke-width: 1.5; } }
    .title { fill: #fff; font-size: 22px; font-weight: 700; letter-spacing: 1px; }
    .sub { fill: #9a9ab5; font-size: 13px; }
    .step { fill: #fff; font-size: 13px; font-weight: 700; }
    .name { fill: #fff; font-size: 15px; font-weight: 700; }
    .tool { fill: #b8b8d8; font-size: 12px; }
    .foot { fill: #c9c9e0; font-size: 13px; }
  </style>

  <rect x="1" y="1" width="898" height="368" rx="18" fill="#0b0b12" stroke="url(#g)" stroke-width="2"/>

  <text class="title" x="450" y="46" text-anchor="middle">FROM RAW DATA TO ACTIONABLE INSIGHTS</text>
  <text class="sub" x="450" y="68" text-anchor="middle">How I turn messy data into business decisions</text>
  <rect x="330" y="80" width="240" height="2" rx="1" fill="url(#g)"/>

  <!-- connectors -->
  <g stroke="url(#g)" stroke-width="2.5" fill="none">
    <path class="flow" d="M160 185 H207"/>
    <path class="flow" d="M337 185 H385"/>
    <path class="flow" d="M515 185 H563"/>
    <path class="flow" d="M693 185 H740"/>
  </g>
  <!-- moving data dots -->
  <g fill="#f093fb">
    <circle r="4"><animateMotion dur="2s" repeatCount="indefinite" path="M160 185 H207"/></circle>
    <circle r="4"><animateMotion dur="2s" begin="0.4s" repeatCount="indefinite" path="M337 185 H385"/></circle>
    <circle r="4"><animateMotion dur="2s" begin="0.8s" repeatCount="indefinite" path="M515 185 H563"/></circle>
    <circle r="4"><animateMotion dur="2s" begin="1.2s" repeatCount="indefinite" path="M693 185 H740"/></circle>
  </g>

  <!-- node 1 -->
  <g class="fade n1">
    <rect class="node p1" x="30" y="115" width="130" height="140" rx="14" fill="url(#card)" stroke="#2a2a44"/>
    <circle cx="95" cy="142" r="14" fill="url(#g)"/><text class="step" x="95" y="147" text-anchor="middle">1</text>
    <text class="name" x="95" y="187" text-anchor="middle">Collect</text>
    <text class="tool" x="95" y="209" text-anchor="middle">Excel, CSV</text>
    <text class="tool" x="95" y="227" text-anchor="middle">Databases</text>
  </g>
  <!-- node 2 -->
  <g class="fade n2">
    <rect class="node p2" x="207" y="115" width="130" height="140" rx="14" fill="url(#card)" stroke="#2a2a44"/>
    <circle cx="272" cy="142" r="14" fill="url(#g)"/><text class="step" x="272" y="147" text-anchor="middle">2</text>
    <text class="name" x="272" y="187" text-anchor="middle">Clean</text>
    <text class="tool" x="272" y="209" text-anchor="middle">SQL, Power Query</text>
    <text class="tool" x="272" y="227" text-anchor="middle">Google Sheets</text>
  </g>
  <!-- node 3 -->
  <g class="fade n3">
    <rect class="node p3" x="385" y="115" width="130" height="140" rx="14" fill="url(#card)" stroke="#2a2a44"/>
    <circle cx="450" cy="142" r="14" fill="url(#g)"/><text class="step" x="450" y="147" text-anchor="middle">3</text>
    <text class="name" x="450" y="187" text-anchor="middle">Transform</text>
    <text class="tool" x="450" y="209" text-anchor="middle">Python, Pandas</text>
    <text class="tool" x="450" y="227" text-anchor="middle">DAX, ETL</text>
  </g>
  <!-- node 4 -->
  <g class="fade n4">
    <rect class="node p4" x="563" y="115" width="130" height="140" rx="14" fill="url(#card)" stroke="#2a2a44"/>
    <circle cx="628" cy="142" r="14" fill="url(#g)"/><text class="step" x="628" y="147" text-anchor="middle">4</text>
    <text class="name" x="628" y="187" text-anchor="middle">Visualize</text>
    <text class="tool" x="628" y="209" text-anchor="middle">Power BI, Tableau</text>
    <text class="tool" x="628" y="227" text-anchor="middle">Looker Studio</text>
  </g>
  <!-- node 5 -->
  <g class="fade n5">
    <rect class="node p5" x="740" y="115" width="130" height="140" rx="14" fill="url(#card)" stroke="#2a2a44"/>
    <circle cx="805" cy="142" r="14" fill="url(#g)"/><text class="step" x="805" y="147" text-anchor="middle">5</text>
    <text class="name" x="805" y="187" text-anchor="middle">Decide</text>
    <text class="tool" x="805" y="209" text-anchor="middle">KPI Reports</text>
    <text class="tool" x="805" y="227" text-anchor="middle">Business Insights</text>
  </g>

  <!-- footer -->
  <rect x="30" y="285" width="840" height="1.5" fill="url(#g)" opacity="0.5"/>
  <text class="foot" x="450" y="322" text-anchor="middle">Automated reporting  |  Interactive dashboards  |  KPI-driven decision making</text>
  <text class="sub" x="450" y="345" text-anchor="middle">Mohit Kumar Ojha  -  Data Analyst</text>
</svg>
